server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /health { default_type text/plain; return 200 "Frontend is Live\n"; }
  location /user/ { proxy_pass http://user:3001/; proxy_set_header Host $host; }
  location /product/ { proxy_pass http://product:3002/; proxy_set_header Host $host; }
  location /cart/ { proxy_pass http://cart:3003/; proxy_set_header Host $host; }
  location /order/ { proxy_pass http://order:3004/; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
